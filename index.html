<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주식 일기</title>
<style>
  :root {
    --bg: #f5f6fa;
    --card-bg: #ffffff;
    --text: #1f2430;
    --sub: #6b7280;
    --accent: #4f46e5;
    --border: #e5e7eb;
    --buy: #16a34a;
    --sell: #e11d48;
    --row-bg: #f9fafb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", "Pretendard", "Apple SD Gothic Neo", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 40px 20px 80px;
  }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
  }
  header {
    text-align: center;
    margin-bottom: 20px;
  }
  header a {
    font-size: 13px;
    color: var(--sub);
    text-decoration: none;
  }
  header h1 {
    font-size: 24px;
    margin: 8px 0 0;
  }
  .panel {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .panel h2 {
    font-size: 15px;
    margin: 0 0 14px;
  }
  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .form-grid .full {
    grid-column: 1 / -1;
  }
  label {
    font-size: 12px;
    color: var(--sub);
    display: block;
    margin-bottom: 4px;
  }
  input, select {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
  }
  input:focus, select:focus {
    outline: none;
    border-color: var(--accent);
  }
  .add-btn {
    margin-top: 14px;
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 11px 0;
    font-size: 14px;
    cursor: pointer;
  }
  .add-btn:hover {
    opacity: 0.9;
  }
  .summary {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--sub);
  }
  .summary b {
    color: var(--text);
    font-size: 15px;
  }
  .entry {
    background: var(--row-bg);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 8px;
  }
  .entry-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 4px;
  }
  .entry-top .name {
    font-weight: 600;
    font-size: 14px;
  }
  .entry-top .date {
    font-size: 12px;
    color: var(--sub);
  }
  .tag {
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
    color: #fff;
    margin-right: 6px;
  }
  .tag.buy { background: var(--buy); }
  .tag.sell { background: var(--sell); }
  .entry-mid {
    font-size: 13px;
    color: var(--text);
    margin-bottom: 4px;
  }
  .entry-memo {
    font-size: 12px;
    color: var(--sub);
  }
  .entry-bottom {
    display: flex;
    justify-content: flex-end;
    margin-top: 6px;
  }
  .del-btn {
    background: none;
    border: none;
    color: var(--sub);
    font-size: 12px;
    text-decoration: underline;
    cursor: pointer;
  }
  .del-btn:hover {
    color: var(--sell);
  }
  .empty {
    text-align: center;
    color: var(--sub);
    font-size: 13px;
    padding: 20px 0;
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <a href="https://fatemap6833.github.io/">← 실습 자료 모음으로</a>
    <h1>📈 주식 일기</h1>
  </header>

  <div class="panel">
    <h2>매매 기록 추가</h2>
    <div class="form-grid">
      <div>
        <label>날짜</label>
        <input type="date" id="f-date">
      </div>
      <div>
        <label>구분</label>
        <select id="f-type">
          <option value="buy">매수</option>
          <option value="sell">매도</option>
        </select>
      </div>
      <div class="full">
        <label>종목명</label>
        <input type="text" id="f-name" placeholder="예: 삼성전자">
      </div>
      <div>
        <label>가격 (1주당)</label>
        <input type="number" id="f-price" placeholder="0" min="0">
      </div>
      <div>
        <label>수량</label>
        <input type="number" id="f-qty" placeholder="0" min="0">
      </div>
      <div class="full">
        <label>메모 (선택)</label>
        <input type="text" id="f-memo" placeholder="매매 이유, 느낀 점 등">
      </div>
    </div>
    <button class="add-btn" id="addBtn">기록 추가</button>
  </div>

  <div class="panel">
    <h2>요약</h2>
    <div class="summary">
      <span>총 매수금액 <b id="sumBuy">0원</b></span>
      <span>총 매도금액 <b id="sumSell">0원</b></span>
    </div>
  </div>

  <div class="panel">
    <h2>기록 목록</h2>
    <div id="list"></div>
    <div class="empty" id="emptyMsg" style="display:none;">아직 기록이 없습니다</div>
  </div>
</div>

<script>
  const STORAGE_KEY = "stock-diary-entries";
  let entries = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");

  const listEl = document.getElementById("list");
  const emptyMsg = document.getElementById("emptyMsg");
  const sumBuyEl = document.getElementById("sumBuy");
  const sumSellEl = document.getElementById("sumSell");

  document.getElementById("f-date").value = new Date().toISOString().slice(0, 10);

  function fmt(n) {
    return Number(n).toLocaleString("ko-KR") + "원";
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
  }

  function render() {
    const sorted = [...entries].sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);

    listEl.innerHTML = "";
    sorted.forEach(e => {
      const div = document.createElement("div");
      div.className = "entry";

      const amount = e.price * e.qty;

      div.innerHTML = `
        <div class="entry-top">
          <div>
            <span class="tag ${e.type}">${e.type === "buy" ? "매수" : "매도"}</span>
            <span class="name">${e.name}</span>
          </div>
          <span class="date">${e.date}</span>
        </div>
        <div class="entry-mid">${e.qty}주 × ${fmt(e.price)} = ${fmt(amount)}</div>
        ${e.memo ? `<div class="entry-memo">${e.memo}</div>` : ""}
        <div class="entry-bottom">
          <button class="del-btn" data-id="${e.id}">삭제</button>
        </div>
      `;
      listEl.appendChild(div);
    });

    emptyMsg.style.display = sorted.length === 0 ? "block" : "none";

    const totalBuy = entries.filter(e => e.type === "buy").reduce((s, e) => s + e.price * e.qty, 0);
    const totalSell = entries.filter(e => e.type === "sell").reduce((s, e) => s + e.price * e.qty, 0);
    sumBuyEl.textContent = fmt(totalBuy);
    sumSellEl.textContent = fmt(totalSell);

    listEl.querySelectorAll(".del-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const id = Number(btn.dataset.id);
        entries = entries.filter(e => e.id !== id);
        save();
        render();
      });
    });
  }

  document.getElementById("addBtn").addEventListener("click", () => {
    const date = document.getElementById("f-date").value;
    const type = document.getElementById("f-type").value;
    const name = document.getElementById("f-name").value.trim();
    const price = Number(document.getElementById("f-price").value);
    const qty = Number(document.getElementById("f-qty").value);
    const memo = document.getElementById("f-memo").value.trim();

    if (!date || !name || !price || !qty) {
      alert("날짜, 종목명, 가격, 수량을 모두 입력해 주세요.");
      return;
    }

    entries.push({ id: Date.now(), date, type, name, price, qty, memo });
    save();
    render();

    document.getElementById("f-name").value = "";
    document.getElementById("f-price").value = "";
    document.getElementById("f-qty").value = "";
    document.getElementById("f-memo").value = "";
  });

  render();
</script>

</body>
</html>
